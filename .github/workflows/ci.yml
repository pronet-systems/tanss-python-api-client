name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Abhaengigkeiten installieren
        run: pip install -e ".[dev]"

      # Die Live-Proben bleiben aussen vor: Sie brauchen eine echte Instanz.
      - name: Proben
        run: pytest tests --ignore=tests/live -q

      - name: Abdeckung des Endpunkt-Index
        run: python tools/verify_coverage.py
